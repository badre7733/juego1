<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QUANTUM VOID — Multiplayer Space Combat</title>
  <!-- Carga de PeerJS para multijugador P2P libre sin backend -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      color: #e0f2fe;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* CAPAS UI Y MENÚS */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      z-index: 10;
    }

    .interactive {
      pointer-events: auto;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
    }

    .status-panel {
      background: rgba(8, 15, 30, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      min-width: 220px;
      backdrop-filter: blur(5px);
    }

    .bar-container {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      margin: 4px 0 8px 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .bar-fill {
      height: 100%;
      transition: width 0.2s ease;
    }

    .shield-fill { background: linear-gradient(90deg, #00d2ff, #0072ff); }
    .hull-fill { background: linear-gradient(90deg, #00f2fe, #4facfe); }
    .p2-shield-fill { background: linear-gradient(90deg, #ff416c, #ff4b2b); }

    .menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.92);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .menu-card {
      background: rgba(13, 24, 48, 0.95);
      border: 2px solid #00f0ff;
      border-radius: 12px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      color: #00f0ff;
      text-shadow: 0 0 15px #00f0ff;
      margin-bottom: 20px;
    }

    .btn {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(0, 114, 255, 0.4));
      border: 1px solid #00f0ff;
      color: #fff;
      font-weight: bold;
      letter-spacing: 1.5px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.5), rgba(0, 114, 255, 0.7));
      box-shadow: 0 0 15px #00f0ff;
      transform: translateY(-2px);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 2px;
      border-radius: 6px;
      outline: none;
    }

    /* CONTROLES TÁCTILES MÓVILES */
    .touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 150px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
    }

    .joystick-zone {
      width: 130px;
      height: 130px;
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 50%;
      position: relative;
      pointer-events: auto;
      touch-action: none;
    }

    .joystick-knob {
      width: 50px;
      height: 50px;
      background: #00f0ff;
      border-radius: 50%;
      position: absolute;
      top: 40px;
      left: 40px;
      box-shadow: 0 0 15px #00f0ff;
      pointer-events: none;
    }

    .fire-btn {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(255, 65, 108, 0.8), rgba(255, 75, 43, 0.6));
      border: 2px solid #ff416c;
      border-radius: 50%;
      pointer-events: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 65, 108, 0.6);
      touch-action: manipulation;
    }

    .fire-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD EN JUEGO -->
  <div class="ui-layer">
    <div class="hud-top">
      <div class="status-panel">
        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
          <span>ESCUDO</span><span id="shield-val">100%</span>
        </div>
        <div class="bar-container"><div id="shield-bar" class="bar-fill shield-fill" style="width:100%"></div></div>
        
        <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
          <span>CASCO</span><span id="hull-val">100%</span>
        </div>
        <div class="bar-container"><div id="hull-bar" class="bar-fill hull-fill" style="width:100%"></div></div>
        
        <div style="font-size:0.9rem; color:#00f0ff; margin-top:4px;">
          CRÉDITOS: <span id="credits-val">0</span>
        </div>
      </div>

      <div class="status-panel" id="p2-panel" style="display:none; border-color:#ff416c;">
        <div style="color:#ff416c; font-weight:bold; margin-bottom:4px;">RIVAL (J2)</div>
        <div class="bar-container"><div id="p2-hull-bar" class="bar-fill p2-shield-fill" style="width:100%"></div></div>
      </div>
    </div>
  </div>

  <!-- CONTROLES TÁCTILES -->
  <div class="touch-controls" id="touch-layer">
    <div class="joystick-zone" id="joystick">
      <div class="joystick-knob" id="knob"></div>
    </div>
    <div class="fire-btn" id="btn-fire">FUEGO</div>
  </div>

  <!-- MENÚ PRINCIPAL -->
  <div class="menu-overlay interactive" id="main-menu">
    <div class="menu-card">
      <h1>QUANTUM VOID</h1>
      <p style="color:#94a3b8; margin-bottom:20px; font-size:0.9rem;">COMBATE ESPACIAL MULTIJUGADOR P2P</p>
      
      <button class="btn" onclick="startSinglePlayer()">MODO UN JUGADOR</button>
      <button class="btn" onclick="showMultiplayerMenu()">MULTIJUGADOR P2P</button>
      <button class="btn" onclick="alert('Usa las flechas/WASD para moverte y ESPACIO para disparar. En móviles usa los joysticks.')">CONTROLES</button>
    </div>
  </div>

  <!-- MENÚ MULTIJUGADOR -->
  <div class="menu-overlay interactive" id="mp-menu" style="display:none;">
    <div class="menu-card">
      <h2>SALA MULTIJUGADOR</h2>
      <p style="color:#94a3b8; font-size:0.85rem; margin:10px 0;">Conéctate directamente con otro jugador mediante código de sala.</p>
      
      <button class="btn" onclick="createRoom()">CREAR SALA (HOST)</button>
      
      <hr style="border:0; border-top:1px solid rgba(0,240,255,0.2); margin:15px 0;">
      
      <input type="text" id="room-code-input" placeholder="CÓDIGO DE SALA" maxlength="6">
      <button class="btn" onclick="joinRoom()">UNIRSE A SALA</button>
      <button class="btn" style="background:transparent; border:none; color:#94a3b8;" onclick="hideMultiplayerMenu()">VOLVER</button>
      
      <div id="mp-status" style="margin-top:10px; font-size:0.85rem; color:#00f0ff;"></div>
    </div>
  </div>
</div>

<script>
  // CONFIGURACIÓN Y ESTADO DEL JUEGO
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  let isMultiplayer = false;
  let isHost = false;
  let peer = null;
  let conn = null;

  let credits = parseInt(localStorage.getItem('qv_credits') || '500');
  document.getElementById('credits-val').innerText = credits;

  // JUGADORES
  const player1 = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    vx: 0, vy: 0,
    angle: 0,
    shield: 100, maxShield: 100,
    hull: 100, maxHull: 100,
    shipType: 0,
    radius: 24
  };

  const player2 = {
    x: -1000, y: -1000,
    angle: 0,
    hull: 100, maxHull: 100,
    active: false,
    shipType: 1,
    radius: 24
  };

  let bullets = [];
  let enemies = [];
  let particles = [];

  // ENTRADAS DE CONTROL
  const keys = {};
  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);

  // JOYSTICK TÁCTIL
  let touchVector = { x: 0, y: 0 };
  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('knob');

  joystick.addEventListener('touchstart', handleTouch);
  joystick.addEventListener('touchmove', handleTouch);
  joystick.addEventListener('touchend', () => {
    touchVector = { x: 0, y: 0 };
    knob.style.top = '40px';
    knob.style.left = '40px';
  });

  function handleTouch(e) {
    e.preventDefault();
    const rect = joystick.getBoundingClientRect();
    const touch = e.touches[0];
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    
    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;
    const dist = Math.hypot(dx, dy);
    const maxDist = rect.width / 2;

    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }

    knob.style.left = (40 + dx) + 'px';
    knob.style.top = (40 + dy) + 'px';
    touchVector = { x: dx / maxDist, y: dy / maxDist };
  }

  document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
    e.preventDefault();
    shootBullet(player1, isHost ? 'p1' : 'p2');
  });

  // SISTEMA MULTIJUGADOR P2P
  function showMultiplayerMenu() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('mp-menu').style.display = 'flex';
  }

  function hideMultiplayerMenu() {
    document.getElementById('mp-menu').style.display = 'none';
    document.getElementById('main-menu').style.display = 'flex';
  }

  function createRoom() {
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('mp-status').innerText = 'Generando sala: ' + code + '...';
    
    peer = new Peer('qv-' + code);

    peer.on('open', () => {
      document.getElementById('mp-status').innerText = 'SALA CREADA: ' + code + '\nEsperando al Jugador 2...';
      isHost = true;
      isMultiplayer = true;
    });

    peer.on('connection', (c) => {
      conn = c;
      setupConnection();
      document.getElementById('mp-status').innerText = '¡Jugador 2 Conectado!';
      setTimeout(() => {
        document.getElementById('mp-menu').style.display = 'none';
        document.getElementById('p2-panel').style.display = 'block';
        player2.active = true;
      }, 1000);
    });

    peer.on('error', err => {
      document.getElementById('mp-status').innerText = 'Error al crear sala: ' + err.type;
    });
  }

  function joinRoom() {
    const code = document.getElementById('room-code-input').value.trim();
    if (code.length !== 6) {
      alert('Introduce un código de sala válido de 6 dígitos.');
      return;
    }

    document.getElementById('mp-status').innerText = 'Conectando a la sala...';
    peer = new Peer();

    peer.on('open', () => {
      conn = peer.connect('qv-' + code);
      setupConnection();
    });

    peer.on('error', err => {
      document.getElementById('mp-status').innerText = 'Error de conexión: Sala no encontrada';
    });
  }

  function setupConnection() {
    conn.on('open', () => {
      isMultiplayer = true;
      document.getElementById('mp-status').innerText = '¡Conectado exitosamente!';
      document.getElementById('mp-menu').style.display = 'none';
      document.getElementById('p2-panel').style.display = 'block';
      player2.active = true;
    });

    conn.on('data', (data) => {
      if (data.type === 'SYNC') {
        player2.x = data.x;
        player2.y = data.y;
        player2.angle = data.angle;
        player2.hull = data.hull;
        document.getElementById('p2-hull-bar').style.width = Math.max(0, player2.hull) + '%';
      } else if (data.type === 'SHOOT') {
        shootBullet(player2, isHost ? 'p2' : 'p1', false);
      } else if (data.type === 'HIT') {
        // Impacto reportado
        takeDamage(player1, data.damage);
      }
    });
  }

  function startSinglePlayer() {
    document.getElementById('main-menu').style.display = 'none';
    spawnEnemies();
  }

  function spawnEnemies() {
    for (let i = 0; i < 3; i++) {
      enemies.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: 0, vy: 0,
        angle: 0,
        hull: 40,
        radius: 20
      });
    }
  }

  function shootBullet(shooter, owner, broadcast = true) {
    const speed = 12;
    bullets.push({
      x: shooter.x + Math.cos(shooter.angle) * 30,
      y: shooter.y + Math.sin(shooter.angle) * 30,
      vx: Math.cos(shooter.angle) * speed,
      vy: Math.sin(shooter.angle) * speed,
      owner: owner,
      life: 80
    });

    if (broadcast && isMultiplayer && conn) {
      conn.send({ type: 'SHOOT' });
    }
  }

  function takeDamage(target, amount) {
    if (target.shield > 0) {
      target.shield -= amount;
      if (target.shield < 0) {
        target.hull += target.shield;
        target.shield = 0;
      }
    } else {
      target.hull -= amount;
    }

    if (target.hull <= 0) {
      createExplosion(target.x, target.y);
      target.hull = 100;
      target.shield = 100;
      target.x = Math.random() * canvas.width;
      target.y = Math.random() * canvas.height;
    }
  }

  function createExplosion(x, y) {
    for (let i = 0; i < 25; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        life: 30, color: ['#ff416c', '#00f0ff', '#ffffff'][Math.floor(Math.random() * 3)]
      });
    }
  }

  // DIBUJO DE NAVES PERSONALIZADAS SEGÚN TUS IMÁGENES
  function drawShip(x, y, angle, type, color = '#00f0ff') {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;

    ctx.beginPath();
    if (type === 0) {
      // Nave Estilo 1 (Roja/Gris de cuernos curva - Imagen 3)
      ctx.moveTo(25, 0);
      ctx.lineTo(-15, -20);
      ctx.lineTo(-5, 0);
      ctx.lineTo(-15, 20);
    } else if (type === 1) {
      // Nave Alien Insectoide (Imagen 2)
      ctx.moveTo(30, 0);
      ctx.lineTo(10, -15);
      ctx.lineTo(-20, -25);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-20, 25);
      ctx.lineTo(10, 15);
    } else if (type === 2) {
      // Nave Interceptora Plata (Imagen 4)
      ctx.moveTo(28, 0);
      ctx.lineTo(-10, -18);
      ctx.lineTo(-20, -10);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-20, 10);
      ctx.lineTo(-10, 18);
    } else {
      // Nave Caza Estrellado Naranja (Imagen 5)
      ctx.moveTo(20, 0);
      ctx.lineTo(-15, -25);
      ctx.lineTo(-5, -5);
      ctx.lineTo(-15, 25);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.fill();

    ctx.restore();
  }

  // LOOP PRINCIPAL DEL JUEGO
  function update() {
    // 1. Movimiento Jugador 1
    let moveX = touchVector.x;
    let moveY = touchVector.y;

    if (keys['KeyW'] || keys['ArrowUp']) moveY = -1;
    if (keys['KeyS'] || keys['ArrowDown']) moveY = 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;

    if (keys['Space']) {
      if (!player1.lastShot || Date.now() - player1.lastShot > 200) {
        shootBullet(player1, isHost ? 'p1' : 'p2');
        player1.lastShot = Date.now();
      }
    }

    player1.vx += moveX * 0.4;
    player1.vy += moveY * 0.4;
    player1.vx *= 0.95;
    player1.vy *= 0.95;

    player1.x += player1.vx;
    player1.y += player1.vy;

    if (Math.hypot(moveX, moveY) > 0.1) {
      player1.angle = Math.atan2(moveY, moveX);
    }

    // Regeneración de Escudos
    if (player1.shield < player1.maxShield) player1.shield += 0.05;

    // Actualizar HUD local
    document.getElementById('shield-bar').style.width = Math.max(0, player1.shield) + '%';
    document.getElementById('hull-bar').style.width = Math.max(0, player1.hull) + '%';
    document.getElementById('shield-val').innerText = Math.round(player1.shield) + '%';
    document.getElementById('hull-val').innerText = Math.round(player1.hull) + '%';

    // Sincronización P2P
    if (isMultiplayer && conn && conn.open) {
      conn.send({
        type: 'SYNC',
        x: player1.x,
        y: player1.y,
        angle: player1.angle,
        hull: player1.hull
      });
    }

    // 2. Proyectiles y Colisiones PvP
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx;
      b.y += b.vy;
      b.life--;

      // Impacto en Jugador 1
      if (b.owner !== (isHost ? 'p1' : 'p2') && Math.hypot(b.x - player1.x, b.y - player1.y) < player1.radius) {
        takeDamage(player1, 15);
        createExplosion(b.x, b.y);
        bullets.splice(i, 1);
        continue;
      }

      if (b.life <= 0) bullets.splice(i, 1);
    }

    // 3. Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo azul profundo estelar (Estilo Imagen 1)
    let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width);
    grad.addColorStop(0, '#0a122c');
    grad.addColorStop(1, '#020514');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dibujar Estrellas
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 50; i++) {
      let sx = (i * 137.5) % canvas.width;
      let sy = (i * 293.3) % canvas.height;
      ctx.fillRect(sx, sy, (i % 3 === 0) ? 2 : 1, (i % 3 === 0) ? 2 : 1);
    }

    // Dibujar Jugador 1
    drawShip(player1.x, player1.y, player1.angle, player1.shipType, '#00f0ff');

    // Dibujar Jugador 2 (Rival Multijugador)
    if (player2.active) {
      drawShip(player2.x, player2.y, player2.angle, player2.shipType, '#ff416c');
    }

    // Dibujar Enemigos IA
    enemies.forEach(e => drawShip(e.x, e.y, e.angle, 3, '#ff9900'));

    // Dibujar Disparos
    ctx.fillStyle = '#00f0ff';
    bullets.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });

    // Dibujar Explosiones
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
    });
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
